version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    environment:
      - NODE_ENV=development

  notekeeper:
    build:
      context: .
      dockerfile: notekeeper/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
