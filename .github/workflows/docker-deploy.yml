name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Backend Lint (flake8)
        run: docker compose -f docker-compose.dev.yml run --rm notekeeper flake8 .

      - name: Run Backend Tests (pytest)
        run: docker compose -f docker-compose.dev.yml run --rm notekeeper pytest

      - name: Run Frontend Lint (eslint)
        run: docker compose -f docker-compose.dev.yml run --rm frontend npm run lint

      - name: Run Frontend Tests (Jest)
        run: docker compose -f docker-compose.dev.yml run --rm frontend npm test -- --watchAll=false

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-test-lint
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.prod -t $DOCKERHUB_USERNAME/notekeeper:latest .
          docker push $DOCKERHUB_USERNAME/backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile.prod -t $DOCKERHUB_USERNAME/frontend:latest ./frontend
          docker push $DOCKERHUB_USERNAME/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Dev Environment
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Deploy to Preprod Environment
        run: docker compose -f docker-compose.preprod.yml up -d --build

      - name: Deploy to Prod Environment
        run: docker compose -f docker-compose.prod.yml up -d --build
