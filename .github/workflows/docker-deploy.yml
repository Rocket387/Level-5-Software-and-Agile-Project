name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Dump workspace
        run: ls -R .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ← build both services first
      - name: Build services
        run: docker compose -f docker-compose.dev.yml build frontend notekeeper

      - name: Start services
        run: |
          docker compose -f docker-compose.dev.yml up -d
          until curl -sSf http://localhost:8080/health; do
            echo "Waiting for app..."; sleep 2;
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-config scanner.threadPerHost=5 -config spider.maxDuration=2'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap_report.html

      - name: Run Backend Lint (flake8)
        continue-on-error: true
        run: docker compose -f docker-compose.dev.yml run --rm notekeeper flake8 .

      - name: Run Backend Tests (pytest)
        continue-on-error: true
        run: docker compose -f docker-compose.dev.yml run --rm notekeeper pytest

      - name: Run Frontend Lint (eslint)
        continue-on-error: true
        run: docker compose -f docker-compose.dev.yml run --rm frontend npm run lint

      - name: Run Frontend Tests (Jest)
        continue-on-error: true
        run: docker compose -f docker-compose.dev.yml run --rm frontend npm test -- --watchAll=false

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-test-lint
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.prod -t $DOCKERHUB_USERNAME/notekeeper:latest .
          docker push $DOCKERHUB_USERNAME/notekeeper:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile.prod -t $DOCKERHUB_USERNAME/frontend:latest ./frontend
          docker push $DOCKERHUB_USERNAME/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Dev Environment
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Deploy to Preprod Environment
        run: docker compose -f docker-compose.preprod.yml up -d --build

      - name: Deploy to Prod Environment
        run: docker compose -f docker-compose.prod.yml up -d --build
